version: '3.8'

services:
  # Pehli Service: Humari Flask App
  backend-app:
    build: ./app
    ports:
      - "5000:5000"
    depends_on:
      - db-server

  # Dusri Service: PostgreSQL Database
  db-server:
    image: postgres:15
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: devops_database
    volumes:
      - postgres-data:/var/lib/postgresql/data

# Data bachane ke liye Volume declare karna
volumes:
  postgres-data: